[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qff-utsa-grader"
version = "0.2.0"
description = "Auto-checks for the Qiskit Fall Fest 2026 @ UTSA hands-on labs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Van Tien Nguyen" }]
dependencies = ["qiskit>=2.0", "numpy", "ipython"]

[tool.setuptools]
packages = ["qff_utsa_grader"]
